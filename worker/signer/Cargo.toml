[package]
name = "ecid-signer"
version = "0.1.0"
edition = "2024"
description = "Apple developer-services signer for ecid-finder (wraps isideload; session-only credentials)"
license = "MIT"

[dependencies]
isideload = { version = "0.4.4", default-features = false, features = ["install", "tokio-mt", "fs-storage"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8.3", default-features = false, features = ["deflate"] }
walkdir = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
